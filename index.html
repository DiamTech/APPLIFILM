<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner VIN & Signature</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        /* Styles personnalisés pour mobile */
        .window-btn { transition: all 0.2s; border: 2px solid #e2e8f0; }
        .window-btn.selected { background-color: #4f46e5; color: white; border-color: #4338ca; transform: scale(0.95); }
        
        #cam-canvas { transform: scaleX(1); width: 100%; height: 100%; object-fit: cover; }
        
        /* Le viseur du scanner */
        .scanner-target {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; height: 120px; border: 2px solid rgba(255,255,255,0.8);
            border-radius: 15px; box-shadow: 0 0 0 4000px rgba(0,0,0,0.6);
            z-index: 10; pointer-events: none;
        }
        .scanner-target::after {
            content: "ALIGNEZ LE VIN ICI"; position: absolute; bottom: -30px;
            width: 100%; text-align: center; color: white; font-size: 12px; font-weight: bold;
        }

        /* Signature Pad */
        #signature-pad { touch-action: none; cursor: crosshair; }
    </style>
</head>
<body class="bg-slate-50 font-sans pb-24">

    <header class="bg-indigo-600 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <h1 class="font-bold text-lg flex items-center gap-2">
                <i data-lucide="scan-line"></i> Scanner Pro V7
            </h1>
            <span id="batch-count" class="bg-white text-indigo-600 px-3 py-1 rounded-full text-xs font-bold">0</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <label class="block text-sm font-semibold text-slate-700 mb-2">Identification Véhicule</label>
            <div class="flex gap-2">
                <input type="text" id="vin-input" placeholder="Scanner ou taper le VIN" 
                    class="flex-1 bg-slate-100 border-none rounded-xl p-3 text-sm font-mono uppercase focus:ring-2 focus:ring-indigo-500">
                <button onclick="startCamera()" class="bg-indigo-600 text-white p-3 rounded-xl hover:bg-indigo-700">
                    <i data-lucide="camera"></i>
                </button>
            </div>
        </section>

        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
    <label class="block text-sm font-semibold text-slate-700 mb-4 text-center">Plan de pose / Intervention</label>
    
    <div class="relative mx-auto" style="width: 200px; height: 350px; background: #f1f5f9; border-radius: 40px; border: 4px solid #cbd5e1;">
        <button onclick="toggleWindow('Pare-Brise')" id="win-Pare-Brise" class="window-btn absolute top-4 left-1/2 -translate-x-1/2 w-32 h-12 rounded-t-lg text-[10px] flex items-center justify-center border bg-white">PARE-BRISE</button>
        
        <button onclick="toggleWindow('Lat-G')" id="win-Lat-G" class="window-btn absolute top-20 -left-6 w-10 h-16 rounded-l-md text-[8px] border bg-white">LAT G.</button>
        <button onclick="toggleWindow('Lat-D')" id="win-Lat-D" class="window-btn absolute top-20 -right-6 w-10 h-16 rounded-r-md text-[8px] border bg-white">LAT D.</button>

        <button onclick="toggleWindow('Lant-AV')" id="win-Lant-AV" class="window-btn absolute top-32 left-1/2 -translate-x-1/2 w-16 h-16 rounded-md text-[9px] border bg-indigo-50 border-indigo-200">LANT. AV</button>
        <button onclick="toggleWindow('Lant-AR')" id="win-Lant-AR" class="window-btn absolute bottom-20 left-1/2 -translate-x-1/2 w-16 h-16 rounded-md text-[9px] border bg-indigo-50 border-indigo-200">LANT. AR</button>

        <button onclick="toggleWindow('Baie-G1')" id="win-Baie-G1" class="window-btn absolute top-48 -left-6 w-10 h-20 rounded-l-md text-[8px] border bg-white">BAIE G1</button>
        <button onclick="toggleWindow('Baie-G2')" id="win-Baie-G2" class="window-btn absolute bottom-12 -left-6 w-10 h-20 rounded-l-md text-[8px] border bg-white">BAIE G2</button>

        <button onclick="toggleWindow('Baie-D1')" id="win-Baie-D1" class="window-btn absolute top-48 -right-6 w-10 h-20 rounded-r-md text-[8px] border bg-white">BAIE D1</button>
        <button onclick="toggleWindow('Baie-D2')" id="win-Baie-D2" class="window-btn absolute bottom-12 -right-6 w-10 h-20 rounded-r-md text-[8px] border bg-white">BAIE D2</button>

        <button onclick="toggleWindow('Baie-AR')" id="win-Baie-AR" class="window-btn absolute -bottom-4 left-1/2 -translate-x-1/2 w-24 h-10 rounded-b-lg text-[10px] border bg-white">BAIE ARRIÈRE</button>
    </div>

    <div class="mt-12 pt-4 border-t flex justify-around">
        <label class="flex items-center gap-1 text-xs font-bold"><input type="radio" name="type_inter" value="Pose" checked> POSE</label>
        <label class="flex items-center gap-1 text-xs font-bold"><input type="radio" name="type_inter" value="Dépose"> DÉPOSE</label>
        <label class="flex items-center gap-1 text-xs font-bold"><input type="radio" name="type_inter" value="Répa"> RÉPA</label>
    </div>
</section>

        <button onclick="addToBatch()" class="w-full bg-slate-800 text-white p-4 rounded-2xl font-bold shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2">
            <i data-lucide="plus-circle"></i> AJOUTER AU LOT
        </button>

        <div id="batch-container" class="space-y-2"></div>

        <button onclick="openSignature()" class="w-full bg-amber-500 text-white p-4 rounded-2xl font-bold shadow-md flex items-center justify-center gap-2">
            <i data-lucide="pen-tool"></i> SIGNER LE BON
        </button>

    </main>

    <div class="fixed bottom-0 inset-x-0 p-4 bg-slate-50 border-t border-slate-200">
        <button onclick="finalize()" class="w-full bg-green-600 text-white p-4 rounded-2xl font-extrabold shadow-xl text-lg flex items-center justify-center gap-2">
            <i data-lucide="send"></i> FINALISER & ENVOYER
        </button>
    </div>

    <div id="cam-overlay" class="fixed inset-0 bg-black z-[100] hidden flex-col">
        <div class="relative flex-1">
            <video id="hidden-video" class="hidden" playsinline></video>
            <canvas id="cam-canvas"></canvas>
            <div class="scanner-target"></div>
        </div>
        <div class="p-6 bg-black text-white flex justify-between items-center">
            <span id="cam-status" class="text-xs font-bold uppercase tracking-widest px-3 py-1 bg-red-600 rounded">Analyse...</span>
            <button onclick="stopCamera()" class="bg-white/20 p-3 rounded-full"><i data-lucide="x"></i></button>
        </div>
    </div>

    <div id="signature-overlay" class="fixed inset-0 bg-black/80 z-[200] hidden flex-col items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800">Signature Client</h3>
                <button onclick="clearSignature()" class="text-red-500 text-xs font-bold uppercase">Effacer</button>
            </div>
            <canvas id="signature-pad" class="w-full h-64 bg-slate-50"></canvas>
            <div class="p-4 bg-white space-y-2">
                <button onclick="closeSignature()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold">VALIDER LA SIGNATURE</button>
                <button onclick="document.getElementById('signature-overlay').style.display='none'" class="w-full text-slate-400 text-sm py-2">Annuler</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=71"></script>
</body>
</html>
