<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner VIN & Signature</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        .window-btn { transition: all 0.2s; border: 2px solid #e2e8f0; cursor: pointer; }
        /* Style quand une vitre est sélectionnée */
        .window-btn.selected { background-color: #4f46e5 !important; color: white !important; border-color: #4338ca !important; transform: scale(0.95); }
        
        #cam-canvas { width: 100%; height: 100%; object-fit: cover; }
        
        .scanner-target {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; height: 120px; border: 2px solid rgba(255,255,255,0.8);
            border-radius: 15px; box-shadow: 0 0 0 4000px rgba(0,0,0,0.6);
            z-index: 10; pointer-events: none;
        }
        .scanner-target::after {
            content: "ALIGNEZ LE CODE-BARRES OU VIN ICI"; position: absolute; bottom: -30px;
            width: 100%; text-align: center; color: white; font-size: 12px; font-weight: bold;
        }

        #signature-pad { touch-action: none; cursor: crosshair; }
    </style>
</head>
<body class="bg-slate-50 font-sans pb-32">

    <header class="bg-indigo-600 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <h1 class="font-bold text-lg flex items-center gap-2">
                <i data-lucide="scan-line"></i> Scanner Pro V7
            </h1>
            <span id="batch-count" class="bg-white text-indigo-600 px-3 py-1 rounded-full text-xs font-bold">0</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <label class="block text-sm font-semibold text-slate-700 mb-2">Identification Véhicule</label>
            <div class="flex gap-2">
                <input type="text" id="vin-input" placeholder="Scanner ou taper le VIN" 
                    class="flex-1 bg-slate-100 border-none rounded-xl p-3 text-sm font-mono uppercase focus:ring-2 focus:ring-indigo-500">
                <button onclick="startCamera()" class="bg-indigo-600 text-white p-3 rounded-xl hover:bg-indigo-700">
                    <i data-lucide="camera"></i>
                </button>
            </div>
        </section>

        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <label class="block text-sm font-semibold text-slate-700 mb-6 text-center uppercase tracking-wider">Plan d'intervention</label>
            
            <div class="relative mx-auto mb-6" style="width: 240px; height: 460px; background: #f8fafc; border-radius: 50px; border: 3px solid #cbd5e1;">
                <button onclick="toggleWindow('Toit-Avant')" id="win-Toit-Avant" class="window-btn absolute top-32 left-[70px] w-[100px] h-[70px] rounded-xl text-[10px] font-bold border bg-indigo-50 border-indigo-200 flex items-center justify-center text-center">TOIT AVANT</button>
                <button onclick="toggleWindow('Toit-Arriere')" id="win-Toit-Arriere" class="window-btn absolute bottom-28 left-[70px] w-[100px] h-[70px] rounded-xl text-[10px] font-bold border bg-indigo-50 border-indigo-200 flex items-center justify-center text-center">TOIT ARRIÈRE</button>
                <button onclick="toggleWindow('Pare-Brise')" id="win-Pare-Brise" class="window-btn absolute -top-2 left-[40px] w-40 h-16 rounded-t-3xl text-[10px] font-bold border bg-white shadow-sm">PARE-BRISE</button>
                <button onclick="toggleWindow('Vitre-AV-G')" id="win-Vitre-AV-G" class="window-btn absolute top-16 -left-14 w-16 h-24 rounded-l-xl text-[9px] border bg-white shadow-sm text-center">VITRE AVANT<br>GAUCHE</button>
                <button onclick="toggleWindow('Vitre-AV-D')" id="win-Vitre-AV-D" class="window-btn absolute top-16 -right-14 w-16 h-24 rounded-r-xl text-[9px] border bg-white shadow-sm text-center">VITRE AVANT<br>DROITE</button>
                <button onclick="toggleWindow('Vitre-Centrale-G')" id="win-Vitre-Centrale-G" class="window-btn absolute top-44 -left-14 w-16 h-28 rounded-l-xl text-[9px] border bg-white shadow-sm text-center">VITRE<br>CENTRALE<br>GAUCHE</button>
                <button onclick="toggleWindow('Vitre-Centrale-D')" id="win-Vitre-Centrale-D" class="window-btn absolute top-44 -right-14 w-16 h-28 rounded-r-xl text-[9px] border bg-white shadow-sm text-center">VITRE<br>CENTRALE<br>DROITE</button>
                <button onclick="toggleWindow('Vitre-AR-G')" id="win-Vitre-AR-G" class="window-btn absolute bottom-10 -left-14 w-16 h-24 rounded-l-xl text-[9px] border bg-white shadow-sm text-center">VITRE ARRIÈRE<br>GAUCHE</button>
                <button onclick="toggleWindow('Vitre-AR-D')" id="win-Vitre-AR-D" class="window-btn absolute bottom-10 -right-14 w-16 h-24 rounded-r-xl text-[9px] border bg-white shadow-sm text-center">VITRE ARRIÈRE<br>DROITE</button>
                <button onclick="toggleWindow('Lunette-Arriere')" id="win-Lunette-Arriere" class="window-btn absolute -bottom-6 left-[50px] w-[140px] h-12 rounded-b-2xl text-[10px] font-bold border bg-white shadow-sm">LUNETTE ARRIÈRE</button>
            </div>
        </section>

        </section>
<div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mt-6">
    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 ml-1 tracking-wider">Observations / Défauts constatés</label>
    <textarea id="observation-input" rows="2" placeholder="Ex: Rayure porte AR, impact pare-brise..." 
        class="w-full bg-slate-50 border border-slate-100 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none transition-all"></textarea>
</div>

<div class="grid grid-cols-3 gap-2 mt-4">
    <label class="flex flex-col items-center p-3 border-2 rounded-xl bg-white cursor-pointer shadow-sm">
        <input type="radio" name="type_inter" value="Pose" checked class="w-4 h-4 accent-indigo-600">
        <span class="text-[10px] font-bold uppercase mt-1 text-slate-700">Pose</span>
    </label>
    <label class="flex flex-col items-center p-3 border-2 rounded-xl bg-white cursor-pointer shadow-sm">
        <input type="radio" name="type_inter" value="Dépose" class="w-4 h-4 accent-indigo-600">
        <span class="text-[10px] font-bold uppercase mt-1 text-slate-700">Dépose</span>
    </label>
    <label class="flex flex-col items-center p-3 border-2 rounded-xl bg-white cursor-pointer shadow-sm">
        <input type="radio" name="type_inter" value="Répa" class="w-4 h-4 accent-indigo-600">
        <span class="text-[10px] font-bold uppercase mt-1 text-slate-700">Répa</span>
    </label>
</div>

<button onclick="addToBatch()" class="w-full bg-slate-800 text-white p-4 rounded-2xl font-bold shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2 mt-4">
    <i data-lucide="plus-circle"></i> AJOUTER AU LOT
</button>
            <label class="flex flex-col items-center p-3 border-2 rounded-xl bg-white cursor-pointer shadow-sm">
                <input type="radio" name="type_inter" value="Dépose" class="w-4 h-4 accent-indigo-600">
                <span class="text-[10px] font-bold uppercase mt-1 text-slate-700">Dépose</span>
            </label>
            <label class="flex flex-col items-center p-3 border-2 rounded-xl bg-white cursor-pointer shadow-sm">
                <input type="radio" name="type_inter" value="Répa" class="w-4 h-4 accent-indigo-600">
                <span class="text-[10px] font-bold uppercase mt-1 text-slate-700">Répa</span>
            </label>
        </div>

        <button onclick="addToBatch()" class="w-full bg-slate-800 text-white p-4 rounded-2xl font-bold shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2">
            <i data-lucide="plus-circle"></i> AJOUTER AU LOT
        </button>

        <div id="batch-container" class="space-y-2"></div>

        <button onclick="openSignature()" class="w-full bg-amber-500 text-white p-4 rounded-2xl font-bold shadow-md flex items-center justify-center gap-2">
            <i data-lucide="pen-tool"></i> SIGNER LE BON
        </button>

    </main>

    <div class="fixed bottom-0 inset-x-0 p-4 bg-slate-50 border-t border-slate-200 z-40">
        <button onclick="finalize()" class="w-full bg-green-600 text-white p-4 rounded-2xl font-extrabold shadow-xl text-lg flex items-center justify-center gap-2">
            <i data-lucide="send"></i> FINALISER & ENVOYER
        </button>
    </div>

    <div id="cam-overlay" class="fixed inset-0 bg-black z-[100] hidden flex-col">
        <div class="relative flex-1">
            <video id="hidden-video" class="hidden" playsinline></video>
            <canvas id="cam-canvas"></canvas>
            <div class="scanner-target"></div>
        </div>
        <div class="p-6 bg-black text-white flex justify-between items-center">
            <span id="cam-status" class="text-xs font-bold uppercase tracking-widest px-3 py-1 bg-red-600 rounded">Analyse...</span>
            <button onclick="stopCamera()" class="bg-white/20 p-3 rounded-full"><i data-lucide="x"></i></button>
        </div>
    </div>

    <div id="signature-overlay" class="fixed inset-0 bg-black/80 z-[200] hidden flex-col items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800">Signature Client</h3>
                <button onclick="clearSignature()" class="text-red-500 text-xs font-bold uppercase">Effacer</button>
            </div>
            <canvas id="signature-pad" class="w-full h-64 bg-slate-50 border-b"></canvas>
            <div class="p-4 bg-white space-y-2">
                <button onclick="closeSignature()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold">VALIDER LA SIGNATURE</button>
                <button onclick="document.getElementById('signature-overlay').style.display='none'" class="w-full text-slate-400 text-sm py-2">Annuler</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=72"></script>
</body>
</html>
