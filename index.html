<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Applifilm Pro v6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        .window-btn.selected { background-color: #4f46e5 !important; color: white !important; border-color: #4338ca; transform: scale(0.98); }
        canvas { touch-action: none !important; background: #f1f5f9; cursor: crosshair; }
        .fixed-bottom { position: fixed; bottom: 0; left: 0; right: 0; padding: 1rem; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 50; border-top: 1px solid #e2e8f0; }
        .dark .fixed-bottom { background: rgba(15,23,42,0.9); border-color: #1e293b; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans pb-40">

    <div id="splash-screen" class="fixed inset-0 bg-white dark:bg-slate-900 z-[9999] flex items-center justify-center transition-opacity duration-500">
        <img src="https://www.applifilm.fr/wp-content/uploads/2020/07/applifilm.png" class="h-10 animate-pulse">
    </div>

    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 p-4 sticky top-0 z-[100]">
    <div class="flex items-center justify-between max-w-lg mx-auto">
        <img src="https://www.applifilm.fr/wp-content/uploads/2020/07/applifilm.png" class="h-7">
        
        <div class="flex items-center gap-2">
            <div class="relative">
                <button onclick="toggleHistoryMenu()" class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-3 py-2 rounded-xl text-[10px] font-black flex items-center gap-2 border border-slate-200 dark:border-slate-700">
                    <i data-lucide="history" class="w-4 h-4 text-indigo-500"></i>
                    <span id="sent-counter">0 ENVOYÉS</span>
                </button>

                <div id="history-menu" class="hidden absolute right-0 mt-2 w-72 bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[110] overflow-hidden">
                    <div class="p-4 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
                        <h3 class="text-[10px] font-black uppercase tracking-tighter">Historique de la journée</h3>
                    </div>
                    <div id="sent-list" class="max-h-80 overflow-y-auto p-2 space-y-2">
                        <p class="text-center py-6 text-slate-400 text-[10px]">Aucun envoi effectué</p>
                    </div>
                </div>
            </div>
            
            <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800"><i data-lucide="moon" id="dark-icon" class="w-5 h-5 text-slate-500"></i></button>
        </div>
    </div>
</header>

    <main class="max-w-lg mx-auto p-4 space-y-6">
        <section class="space-y-4">
            <div id="reader" class="hidden rounded-2xl overflow-hidden bg-black border-2 border-indigo-600 shadow-2xl"></div>
            <div class="relative flex items-center">
                <input type="text" id="vin-input" placeholder="Scanner ou saisir VIN..." class="w-full bg-white dark:bg-slate-800 rounded-2xl py-4 pl-5 pr-14 shadow-sm border-none text-sm font-mono tracking-wider dark:text-white ring-1 ring-slate-200 dark:ring-slate-700 focus:ring-2 focus:ring-indigo-500">
                <button onclick="startScanner()" class="absolute right-2 bg-indigo-600 text-white p-3 rounded-xl shadow-lg active:scale-90"><i data-lucide="camera" class="w-5 h-5"></i></button>
            </div>
            </section>
            
            <section class="bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 relative overflow-hidden">
            <p class="text-[10px] text-center text-slate-400 dark:text-slate-500 font-black uppercase mb-4 tracking-widest">Vitrages</p>
            
            <div class="relative mx-auto" style="width: 280px; height: 500px;">
            <svg viewBox="0 0 200 480" class="absolute inset-0 w-full h-full fill-none stroke-slate-200 dark:stroke-slate-700" stroke-width="1.5">
                <path d="M50 20 C50 10, 150 10, 150 20 L165 90 L165 420 C165 440, 35 440, 35 420 L35 90 Z" />
            </svg>
            
            <button onclick="toggleWindow('TOIT-AV')" id="win-TOIT-AV" class="window-btn absolute top-[100px] left-1/2 -ml-10 w-20 h-8 rounded-lg text-[8px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-sm">TOIT AV</button>
            <button onclick="toggleWindow('TOIT-AR')" id="win-TOIT-AR" class="window-btn absolute top-[250px] left-1/2 -ml-10 w-20 h-8 rounded-lg text-[8px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-sm">TOIT AR</button>
            
            <button onclick="toggleWindow('PARE-BRISE')" id="win-PARE-BRISE" class="window-btn absolute top-[15px] left-1/2 -ml-20 w-40 h-14 rounded-2xl text-[10px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-md">PARE-BRISE</button>
            
            <div class="absolute left-[-20px] top-[90px] bottom-[110px] flex flex-col justify-between w-20">
                <button onclick="toggleWindow('PORT-G')" id="win-PORT-G" class="window-btn w-16 h-16 rounded-2xl text-[9px] bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 font-bold shadow-sm">PORT. G</button>
                <button onclick="toggleWindow('LAT-G1')" id="win-LAT-G1" class="window-btn w-16 h-20 rounded-2xl text-[9px] bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 font-bold shadow-sm">LAT. G1</button>
                <button onclick="toggleWindow('LAT-G2')" id="win-LAT-G2" class="window-btn w-16 h-20 rounded-2xl text-[9px] bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 font-bold shadow-sm">LAT. G2</button>
            </div>
            
            <div class="absolute right-[-20px] top-[90px] bottom-[110px] flex flex-col justify-between items-end w-20">
                <button onclick="toggleWindow('PORT-D')" id="win-PORT-D" class="window-btn w-16 h-16 rounded-2xl text-[9px] bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 font-bold shadow-sm">PORT. D</button>
                <button onclick="toggleWindow('LAT-D1')" id="win-LAT-D1" class="window-btn w-16 h-20 rounded-2xl text-[9px] bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 font-bold shadow-sm">LAT. D1</button>
                <button onclick="toggleWindow('LAT-D2')" id="win-LAT-D2" class="window-btn w-16 h-20 rounded-2xl text-[9px] bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 font-bold shadow-sm">LAT. D2</button>
            </div>
            
            <div class="absolute bottom-[20px] left-1/2 -ml-24 w-48 flex gap-2">
                <button onclick="toggleWindow('LUN-G')" id="win-LUN-G" class="window-btn flex-1 h-14 rounded-2xl text-[9px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-md">LUN. G</button>
                <button onclick="toggleWindow('LUN-D')" id="win-LUN-D" class="window-btn flex-1 h-14 rounded-2xl text-[9px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-md">LUN. D</button>
            </div>
            </div>
            </section>

        <section class="space-y-4">
            <div class="flex gap-2">
                <input type="radio" name="type" value="POSE" id="t1" checked class="hidden peer/p"><label for="t1" class="flex-1 p-3 text-center bg-white dark:bg-slate-800 rounded-2xl border peer-checked/p:bg-indigo-600 peer-checked/p:text-white text-[10px] font-black uppercase">POSE</label>
                <input type="radio" name="type" value="SAV" id="t2" class="hidden peer/s"><label for="t2" class="flex-1 p-3 text-center bg-white dark:bg-slate-800 rounded-2xl border peer-checked/s:bg-indigo-600 peer-checked/s:text-white text-[10px] font-black uppercase">SAV</label>
                <input type="radio" name="type" value="GARANTIE" id="t3" class="hidden peer/g"><label for="t3" class="flex-1 p-3 text-center bg-white dark:bg-slate-800 rounded-2xl border peer-checked/g:bg-indigo-600 peer-checked/g:text-white text-[10px] font-black uppercase">GARANTIE</label>
            </div>
            <textarea id="obs" placeholder="Observations éventuelles..." class="w-full p-4 rounded-2xl border-none bg-white dark:bg-slate-800 shadow-sm text-sm dark:text-white min-h-[80px] focus:ring-2 focus:ring-indigo-500"></textarea>
        </section>

        <section class="bg-white dark:bg-slate-800 p-4 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
    <label class="block text-[10px] font-black text-slate-400 uppercase mb-3 ml-1 tracking-widest">Photos d'intervention</label>
    
    <div class="grid grid-cols-4 gap-2" id="photo-preview-container">
        <label class="aspect-square flex flex-col items-center justify-center border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl cursor-pointer active:scale-95 transition-all bg-slate-50 dark:bg-slate-900/50">
            <i data-lucide="camera" class="w-5 h-5 text-slate-400"></i>
            <span class="text-[8px] font-bold text-slate-400 mt-1 uppercase">Ajouter</span>
            <input type="file" id="file-in" accept="image/*" capture="environment" class="hidden" multiple onchange="handlePhotos(this)">
        </label>
        </div>
</section>

<section id="sig-area" class="mt-4">
    <button id="btn-sig-open" onclick="openSignature()" class="w-full bg-white dark:bg-slate-800 p-5 rounded-3xl border-2 border-indigo-100 dark:border-indigo-900/30 flex items-center justify-center gap-3 active:scale-95 transition-all">
        <i data-lucide="pen-tool" class="text-indigo-500"></i>
        <span class="text-xs font-black text-indigo-600 uppercase tracking-widest">Signer l'intervention</span>
    </button>
    
    <div id="sig-status" class="hidden w-full bg-green-50 dark:bg-green-900/20 p-5 rounded-3xl border-2 border-green-200 flex items-center justify-between animate-in">
        <div class="flex items-center gap-3">
            <i data-lucide="check-circle" class="text-green-500"></i>
            <span class="text-xs font-black text-green-600 uppercase">Signature enregistrée</span>
        </div>
        <button onclick="resetSignature()" class="bg-red-100 text-red-600 p-2 rounded-xl active:scale-90">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
    </div>
</section>

        <button onclick="addToBatch()" class="w-full bg-indigo-600 dark:bg-white text-white dark:text-slate-900 py-5 rounded-3xl font-black text-xs uppercase tracking-widest shadow-lg active:scale-95 transition-all">
            Ajouter au lot
        </button>
    </main>

    <div class="fixed-bottom">
        <div class="max-w-lg mx-auto">
            <button id="btn-final" onclick="finalize()" class="w-full bg-indigo-600 text-white py-5 rounded-3xl font-black text-lg shadow-2xl shadow-indigo-300 flex items-center justify-center gap-3 active:scale-95 transition-all">
                <span>FINALISER L'ENVOI</span>
                <i data-lucide="send" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <div id="modal-sig" class="hidden fixed inset-0 bg-slate-950/90 z-[1000] flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-[2.5rem] p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center px-2">
                <h3 class="font-black text-xs uppercase tracking-tighter">Signature Client</h3>
                <button onclick="closeSignature()" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-full"><i data-lucide="x" class="w-4 h-4 text-slate-400"></i></button>
            </div>
            <div class="overflow-hidden rounded-3xl border-2 border-slate-100 dark:border-slate-700">
                <canvas id="canvas" class="w-full h-64"></canvas>
            </div>
            <div class="flex gap-2">
                <button onclick="clearCanvas()" class="flex-1 py-4 border-2 border-slate-100 dark:border-slate-700 rounded-2xl font-black text-[10px] uppercase">Effacer</button>
                <button onclick="saveSignature()" class="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-black text-[10px] uppercase shadow-lg shadow-indigo-200">Valider</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
