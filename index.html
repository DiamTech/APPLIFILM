<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Applifilm - Intervention</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .window-btn { transition: all 0.2s; }
        .window-btn.selected { 
            background-color: #4f46e5 !important; 
            color: white !important; 
            border-color: #4338ca !important; 
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        canvas { touch-action: none; background: #f8fafc; cursor: crosshair; }
        .dark canvas { background: #1e293b; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen pb-32">

    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 p-4 sticky top-0 z-[100]">
        <div class="flex items-center justify-between max-w-lg mx-auto">
            <img src="https://www.applifilm.fr/wp-content/uploads/2020/07/applifilm.png" class="h-7" alt="Logo">
            
            <div class="flex items-center gap-2">
                <div class="relative">
                    <button type="button" onclick="toggleHistoryMenu()" class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-3 py-2 rounded-xl text-[10px] font-black flex items-center gap-2 border border-slate-200 dark:border-slate-700">
                        <i data-lucide="history" class="w-4 h-4 text-indigo-500"></i>
                        <span id="sent-counter">0 ENVOYÉS</span>
                    </button>
                    <div id="history-menu" class="hidden absolute right-0 mt-2 w-72 bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[110] overflow-hidden">
                        <div class="p-4 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
                            <h3 class="text-[10px] font-black uppercase tracking-widest">Historique Journalier</h3>
                        </div>
                        <div id="sent-list" class="max-h-80 overflow-y-auto p-2 space-y-2"></div>
                    </div>
                </div>
                <button type="button" onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800">
                    <i data-lucide="moon" id="dark-icon" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-lg mx-auto p-4 space-y-6">

        <section class="bg-white dark:bg-slate-800 p-6 rounded-[2.5rem] shadow-sm border border-slate-200 dark:border-slate-700">
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest ml-1">Identification Véhicule</label>
            <div class="flex gap-3">
                <div class="relative flex-1">
                    <input type="text" id="vin-input" placeholder="Scanner ou saisir VIN" class="w-full bg-slate-50 dark:bg-slate-950 border-none rounded-2xl py-4 px-5 text-sm font-bold focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
                <button type="button" onclick="startScanner()" class="bg-indigo-600 text-white p-4 rounded-2xl shadow-lg shadow-indigo-200 dark:shadow-none active:scale-95 transition-all">
                    <i data-lucide="scan-line" class="w-6 h-6"></i>
                </button>
            </div>
            <div id="reader" class="hidden mt-4 rounded-2xl overflow-hidden border-2 border-indigo-100"></div>
        </section>

        <section class="bg-white dark:bg-slate-800 p-4 rounded-[2.5rem] shadow-sm border border-slate-200 dark:border-slate-700 relative overflow-hidden">
            <p class="text-[10px] text-center text-slate-400 font-black uppercase mb-4 tracking-widest">Sélection des Vitrages</p>
            <div class="relative mx-auto" style="width: 280px; height: 500px;">
                <svg viewBox="0 0 200 480" class="absolute inset-0 w-full h-full fill-none stroke-slate-200 dark:stroke-slate-700" stroke-width="1.5">
                    <path d="M50 20 C50 10, 150 10, 150 20 L165 90 L165 420 C165 440, 35 440, 35 420 L35 90 Z" />
                </svg>

                <button type="button" onclick="toggleWindow('PARE-BRISE')" id="win-PARE-BRISE" class="window-btn absolute top-[15px] left-1/2 -ml-20 w-40 h-14 rounded-2xl text-[10px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-md">PARE-BRISE</button>
                <button type="button" onclick="toggleWindow('TOIT-AV')" id="win-TOIT-AV" class="window-btn absolute top-[100px] left-1/2 -ml-10 w-20 h-8 rounded-lg text-[8px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-sm">TOIT AV</button>
                <button type="button" onclick="toggleWindow('TOIT-AR')" id="win-TOIT-AR" class="window-btn absolute top-[250px] left-1/2 -ml-10 w-20 h-8 rounded-lg text-[8px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-sm">TOIT AR</button>

                <div class="absolute left-[-20px] top-[90px] bottom-[110px] flex flex-col justify-between w-20">
                    <button type="button" onclick="toggleWindow('PORT-G')" id="win-PORT-G" class="window-btn w-16 h-16 rounded-2xl text-[9px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-sm">PORT. G</button>
                    <button type="button" onclick="toggleWindow('LAT-G1')" id="win-LAT-G1" class="window-btn w-16 h-20 rounded-2xl text-[9px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-sm">LAT. G1</button>
                    <button type="button" onclick="toggleWindow('LAT-G2')" id="win-LAT-G2" class="window-btn w-16 h-20 rounded-2xl text-[9px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-sm">LAT. G2</button>
                </div>

                <div class="absolute right-[-20px] top-[90px] bottom-[110px] flex flex-col justify-between items-end w-20">
                    <button type="button" onclick="toggleWindow('PORT-D')" id="win-PORT-D" class="window-btn w-16 h-16 rounded-2xl text-[9px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-sm">PORT. D</button>
                    <button type="button" onclick="toggleWindow('LAT-D1')" id="win-LAT-D1" class="window-btn w-16 h-20 rounded-2xl text-[9px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-sm">LAT. D1</button>
                    <button type="button" onclick="toggleWindow('LAT-D2')" id="win-LAT-D2" class="window-btn w-16 h-20 rounded-2xl text-[9px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-sm">LAT. D2</button>
                </div>

                <div class="absolute bottom-[20px] left-1/2 -ml-24 w-48 flex gap-2">
                    <button type="button" onclick="toggleWindow('LUN-G')" id="win-LUN-G" class="window-btn flex-1 h-14 rounded-2xl text-[9px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-md">LUN. G</button>
                    <button type="button" onclick="toggleWindow('LUN-D')" id="win-LUN-D" class="window-btn flex-1 h-14 rounded-2xl text-[9px] font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-600 shadow-md">LUN. D</button>
                </div>
            </div>
        </section>

        <section class="bg-white dark:bg-slate-800 p-6 rounded-[2.5rem] shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
            <div class="flex gap-2 p-1 bg-slate-100 dark:bg-slate-950 rounded-2xl">
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="type" value="POSE" checked class="hidden peer">
                    <div class="text-center py-3 rounded-xl text-[10px] font-black peer-checked:bg-white dark:peer-checked:bg-slate-800 peer-checked:shadow-sm transition-all opacity-40 peer-checked:opacity-100">POSE</div>
                </label>
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="type" value="SAV" class="hidden peer">
                    <div class="text-center py-3 rounded-xl text-[10px] font-black peer-checked:bg-white dark:peer-checked:bg-slate-800 peer-checked:shadow-sm transition-all opacity-40 peer-checked:opacity-100">SAV</div>
                </label>
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="type" value="GARANTIE" class="hidden peer">
                    <div class="text-center py-3 rounded-xl text-[10px] font-black peer-checked:bg-white dark:peer-checked:bg-slate-800 peer-checked:shadow-sm transition-all opacity-40 peer-checked:opacity-100">GARANTIE</div>
                </label>
            </div>
            <textarea id="obs" placeholder="Observations éventuelles..." class="w-full bg-slate-50 dark:bg-slate-950 border-none rounded-2xl py-4 px-5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 h-24 resize-none"></textarea>
        </section>

        <section class="bg-white dark:bg-slate-800 p-6 rounded-[2.5rem] shadow-sm border border-slate-200 dark:border-slate-700">
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest ml-1">Photos d'intervention</label>
            <div class="grid grid-cols-4 gap-3" id="photo-preview-container">
                <label class="aspect-square flex flex-col items-center justify-center border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl cursor-pointer active:scale-95 bg-slate-50 dark:bg-slate-950">
                    <i data-lucide="camera" class="w-5 h-5 text-slate-400"></i>
                    <span class="text-[8px] font-bold text-slate-400 mt-1 uppercase">Ajouter</span>
                    <input type="file" id="file-in" accept="image/*" capture="environment" class="hidden" multiple onchange="handlePhotos(this)">
                </label>
            </div>
        </section>

        <section id="sig-area">
            <button type="button" id="btn-sig-open" onclick="openSignature()" class="w-full bg-white dark:bg-slate-800 p-6 rounded-[2.5rem] border-2 border-indigo-100 dark:border-indigo-900/30 flex items-center justify-center gap-3 active:scale-95 shadow-sm">
                <i data-lucide="pen-tool" class="text-indigo-500"></i>
                <span class="text-xs font-black text-indigo-600 uppercase tracking-widest">Signer l'intervention</span>
            </button>
            <div id="sig-status" class="hidden w-full bg-green-50 dark:bg-green-900/20 p-6 rounded-[2.5rem] border-2 border-green-200 dark:border-green-900 flex items-center justify-between">
                <div class="flex items-center gap-3 text-green-600 font-black text-xs uppercase"><i data-lucide="check-circle"></i> Signature ok</div>
                <button type="button" onclick="resetSignature()" class="bg-red-100 text-red-600 p-2 rounded-xl"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
        </section>

        <button type="button" onclick="addToBatch()" class="w-full bg-indigo-600 dark:bg-white text-white dark:text-slate-900 py-6 rounded-[2.5rem] font-black text-xs uppercase tracking-widest shadow-xl shadow-indigo-200 dark:shadow-none active:scale-95 transition-all">
            Ajouter au lot
        </button>

        <div class="pt-8 text-center space-y-4">
            <div id="batch-counter" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">0 EN ATTENTE</div>
            <button type="button" id="btn-final" onclick="finalize()" class="w-full bg-slate-900 dark:bg-indigo-500 text-white py-6 rounded-[2.5rem] font-black text-xs uppercase tracking-widest flex items-center justify-center gap-3 shadow-2xl active:scale-95 disabled:opacity-50 transition-all">
                <span>Finaliser l'envoi</span>
                <i data-lucide="send" class="w-5 h-5"></i>
            </button>
        </div>

    </main>

    <div id="modal-sig" class="hidden fixed inset-0 z-[200] bg-slate-950/90 backdrop-blur-sm p-4 flex items-center justify-center">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[3rem] overflow-hidden shadow-2xl">
            <div class="p-6 border-b dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950">
                <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Signature Client</span>
                <button type="button" onclick="clearCanvas()" class="text-xs font-bold text-indigo-500">Effacer</button>
            </div>
            <canvas id="canvas" class="w-full h-64"></canvas>
            <div class="p-4 grid grid-cols-2 gap-3 bg-slate-50 dark:bg-slate-950">
                <button type="button" onclick="closeSignature()" class="py-4 rounded-2xl font-bold text-xs bg-white dark:bg-slate-800 text-slate-500 uppercase">Annuler</button>
                <button type="button" onclick="saveSignature()" class="py-4 rounded-2xl font-bold text-xs bg-indigo-600 text-white uppercase">Valider</button>
            </div>
        </div>
    </div>

    <div id="splash-screen" class="fixed inset-0 z-[1000] bg-white dark:bg-slate-950 flex items-center justify-center transition-opacity duration-500">
        <div class="text-center animate-in">
            <img src="https://www.applifilm.fr/wp-content/uploads/2020/07/applifilm.png" class="h-10 mb-6 mx-auto">
            <div class="w-12 h-1 w-32 bg-slate-100 dark:bg-slate-800 rounded-full mx-auto overflow-hidden">
                <div class="h-full bg-indigo-500 w-1/2 animate-[loading_1.5s_infinite]"></div>
            </div>
        </div>
    </div>

    <style>@keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }</style>

    <script src="script.js"></script>
</body>
</html>
