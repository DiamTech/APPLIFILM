<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Applifilm Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        // Configuration de Tailwind pour le mode sombre manuel
        tailwind.config = {
            darkMode: 'class'
        }
    </script>

    <style>
        /* Effet de background dynamique */
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            transition: background-color 0.3s ease;
        }

        /* Mode Sombre : Fond Noir Pur */
        .dark body {
            background-color: #000000 !important;
            background-image: none !important;
        }

        /* Style des vitres */
        .window-btn { transition: all 0.2s; border: 2px solid #e2e8f0; cursor: pointer; }
        .window-btn.selected { 
            background-color: #4f46e5 !important; 
            color: white !important; 
            border-color: #4338ca !important; 
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.3);
        }

        .dark .window-btn { background-color: #111; border-color: #333; color: #666; }

        #signature-pad { touch-action: none; cursor: crosshair; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="font-sans pb-32">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 p-4 sticky top-0 z-[100] transition-colors">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div class="flex items-center">
                <img src="https://www.applifilm.fr/wp-content/uploads/2020/07/applifilm.png" 
                     alt="Applifilm" class="h-10 w-auto object-contain">
            </div>

            <div class="flex items-center gap-2">
                <button onclick="toggleDarkMode()" class="p-2 text-slate-500 hover:bg-slate-100 rounded-xl transition-all">
                    <i data-lucide="moon" id="dark-icon" class="w-5 h-5"></i>
                </button>

                <button onclick="toggleHistory()" class="p-2 text-slate-500 hover:bg-slate-100 rounded-xl transition-all relative">
                    <i data-lucide="history" class="w-5 h-5"></i>
                    <div id="hist-dot" class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-500 rounded-full hidden border-2 border-white"></div>
                </button>
                
                <div class="flex items-center bg-slate-100 rounded-full px-2 py-1 gap-1 border border-slate-200">
                    <div class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></div>
                    <span id="batch-count" class="text-[10px] font-black text-slate-700">0</span>
                </div>
            </div>
        </div>
    </header>

    <div id="history-sidebar" class="fixed inset-y-0 right-0 w-80 bg-white dark:bg-slate-900 shadow-2xl z-[400] transform translate-x-full transition-transform duration-300 ease-in-out border-l border-slate-200 dark:border-slate-800">
        <div class="flex flex-col h-full">
            <div class="p-4 border-b dark:border-slate-800 flex justify-between items-center">
                <h2 class="font-bold dark:text-white text-sm uppercase">Archives</h2>
                <button onclick="toggleHistory()" class="text-slate-400"><i data-lucide="x"></i></button>
            </div>
            <div id="history-container" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
            <div class="p-4 border-t dark:border-slate-800">
                <button onclick="clearHistory()" class="w-full py-3 text-[10px] font-bold text-red-500 bg-red-50 dark:bg-red-900/20 rounded-xl uppercase">Vider</button>
            </div>
        </div>
    </div>
    <div id="history-overlay" onclick="toggleHistory()" class="fixed inset-0 bg-black/50 z-[350] hidden backdrop-blur-sm"></div>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <section class="bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-3 ml-1">Identification</label>
            <div id="reader" class="hidden mb-4 overflow-hidden rounded-2xl border-2 border-indigo-500 bg-black"></div>
            <div class="flex gap-2">
                <input type="text" id="vin-input" placeholder="Scanner ou taper le VIN" 
                    class="flex-1 bg-slate-100 dark:bg-slate-900 border-none rounded-2xl p-4 text-sm font-mono uppercase dark:text-white outline-none">
                <button onclick="startScan()" class="bg-indigo-600 text-white p-4 rounded-2xl active:scale-95 transition-transform">
                    <i data-lucide="camera"></i>
                </button>
            </div>
        </section>

        <section class="bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-6 text-center tracking-widest">Plan d'intervention</label>
            <div class="relative mx-auto mb-6" style="width: 200px; height: 380px; background: #f1f5f9; border-radius: 40px; border: 3px solid #cbd5e1;">
                <button onclick="toggleWindow('Pare-Brise')" id="win-Pare-Brise" class="window-btn absolute -top-1 left-1/2 -translate-x-1/2 w-28 h-12 rounded-t-3xl text-[8px] font-bold bg-white">PARE-BRISE</button>
                <button onclick="toggleWindow('AV-G')" id="win-AV-G" class="window-btn absolute top-14 -left-10 w-12 h-16 rounded-l-lg text-[8px] bg-white">AV-G</button>
                <button onclick="toggleWindow('AV-D')" id="win-AV-D" class="window-btn absolute top-14 -right-10 w-12 h-16 rounded-r-lg text-[8px] bg-white">AV-D</button>
                <button onclick="toggleWindow('CT-G')" id="win-CT-G" class="window-btn absolute top-32 -left-10 w-12 h-20 rounded-l-lg text-[8px] bg-white">MILIEU-G</button>
                <button onclick="toggleWindow('CT-D')" id="win-CT-D" class="window-btn absolute top-32 -right-10 w-12 h-20 rounded-r-lg text-[8px] bg-white">MILIEU-D</button>
                <button onclick="toggleWindow('AR-G')" id="win-AR-G" class="window-btn absolute bottom-8 -left-10 w-12 h-16 rounded-l-lg text-[8px] bg-white">AR-G</button>
                <button onclick="toggleWindow('AR-D')" id="win-AR-D" class="window-btn absolute bottom-8 -right-10 w-12 h-16 rounded-r-lg text-[8px] bg-white">AR-D</button>
                <button onclick="toggleWindow('Lunette')" id="win-Lunette" class="window-btn absolute -bottom-4 left-1/2 -translate-x-1/2 w-24 h-10 rounded-b-xl text-[8px] font-bold bg-white">LUNETTE</button>
            </div>
        </section>

        <div class="bg-white dark:bg-slate-800 p-4 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <textarea id="observation-input" rows="2" placeholder="Observations / Défauts..." 
                class="w-full bg-transparent border-none p-0 text-sm dark:text-white outline-none resize-none"></textarea>
        </div>

        <button onclick="addToBatch()" class="w-full bg-slate-900 dark:bg-indigo-600 text-white p-5 rounded-3xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-all shadow-lg">
            <i data-lucide="plus-circle"></i> AJOUTER AU LOT
        </button>

        <div id="batch-container" class="space-y-3 mt-4"></div>

        <div class="flex gap-2 pb-20">
            <button id="btn-open-sign" onclick="openSignature()" class="flex-1 bg-amber-500 text-white p-5 rounded-3xl font-bold flex items-center justify-center gap-2">
                <i data-lucide="pen-tool"></i> SIGNER LE BON
            </button>
            <button id="btn-clear-sign" onclick="resetSignature()" class="hidden bg-red-100 text-red-600 px-6 rounded-3xl font-bold flex items-center justify-center active:scale-90 transition-all">
                <i data-lucide="trash-2"></i>
            </button>
        </div>
    </main>

    <div class="fixed bottom-0 inset-x-0 p-4 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 z-[300]">
        <button onclick="finalize()" class="w-full bg-green-600 text-white p-5 rounded-3xl font-black shadow-xl flex items-center justify-center gap-2 active:scale-95 transition-all uppercase tracking-widest text-sm">
            <i data-lucide="send"></i> FINALISER & ENVOYER
        </button>
    </div>

    <div id="custom-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[600] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-xs rounded-[2rem] p-8 shadow-2xl animate-in text-center">
            <div id="modal-icon" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"></div>
            <h3 id="modal-title" class="font-bold text-slate-800 dark:text-white text-lg">Message</h3>
            <p id="modal-text" class="text-slate-500 dark:text-slate-400 text-xs mt-2 mb-8"></p>
            <button onclick="closeModal()" class="w-full bg-slate-900 dark:bg-white dark:text-slate-900 text-white p-4 rounded-2xl font-bold">D'ACCORD</button>
        </div>
    </div>

    <div id="signature-overlay" class="fixed inset-0 bg-black/90 z-[500] hidden flex-col items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2rem] overflow-hidden">
            <div class="p-4 border-b dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900/50">
                <span class="text-xs font-bold uppercase dark:text-white">Signature Client</span>
                <button onclick="clearSignature()" class="text-red-500 text-[10px] font-black uppercase">Effacer</button>
            </div>
            <canvas id="signature-pad" class="w-full h-80 bg-white dark:bg-slate-50"></canvas>
            <div class="p-6 flex gap-2">
                <button onclick="closeSignature()" class="flex-1 bg-indigo-600 text-white p-4 rounded-2xl font-bold uppercase text-xs tracking-widest">Valider</button>
                <button onclick="document.getElementById('signature-overlay').style.display='none'" class="bg-slate-100 dark:bg-slate-700 text-slate-400 px-6 rounded-2xl"><i data-lucide="x"></i></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
